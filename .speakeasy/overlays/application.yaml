overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Application overlay
  version: 0.0.1
actions:

  # Entity declaration
  - target: $.components.schemas.AutomationApplication
    update:
      x-speakeasy-entity: Application
      x-speakeasy-entity-description: |-
        An application (OAuth 2.0 / OIDC client) of a domain.

        The application has no client secret until an `am_client_secret` is created for it.

        The `settings.login`, `settings.account` and `settings.cookie_settings` blocks are inherited from the domain when omitted, and override the domain's settings when declared with `inherited = false`. Removing a declared block keeps the current settings: set `inherited = true` to inherit again.

        Changing `type` or `kind` recomputes the OAuth settings AM derives from them (`grant_types`, `response_types`, `token_endpoint_auth_method`, `force_pkce`, `force_s256_code_challenge_method`), except the ones the configuration declares.

  # The resource's own attributes are not computed; nested settings are (common/schema.yaml).
  - target: $.components.schemas.AutomationApplication.properties.*
    update:
      x-speakeasy-param-computed: false

  # Body `key` ↔ path `applicationKey` correlation: rename the path parameter
  # so Speakeasy auto-matches by name against the entity's `key` field.
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}"].get.parameters[?@.name=='applicationKey']
    update:
      x-speakeasy-name-override: key
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}"].delete.parameters[?@.name=='applicationKey']
    update:
      x-speakeasy-name-override: key

  # Operation mapping
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications"].put
    update:
      x-speakeasy-entity-operation: Application#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}"].get
    update:
      x-speakeasy-entity-operation: Application#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}"].delete
    update:
      x-speakeasy-entity-operation: Application#delete

  # AM answers 409 when concurrent writes hit the same application: retry them like a 5XX.
  # An operation-level block replaces the global one (common/oas.yaml), so it is repeated in full.
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications"].put
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500 # 500 milliseconds
          maxInterval: 30000 # 30 seconds
          maxElapsedTime: 60000 # 1 minute
          exponent: 1.5
        statusCodes:
          - 5XX
          - 409
        retryConnectionErrors: true

  # key and the domain are the identity — changing either forces resource recreation.
  # create/update share one PUT op, so ForceNew is not auto-inferred; set it explicitly.
  # type stays in-place: AM changes it, or rejects a change to or from agent.
  - target: $.components.schemas.AutomationApplication.properties.key
    update:
      x-speakeasy-param-force-new: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications"].put.parameters[?@.name=='domainKey']
    update:
      x-speakeasy-param-force-new: true

  # Generated by AM when omitted, then immutable (stringplanmodifier.Immutable).
  - target: $.components.schemas.AutomationApplication.properties.clientId
    update:
      x-speakeasy-param-computed: true
      x-speakeasy-param-suppress-computed-diff: true
      x-speakeasy-plan-modifiers: Immutable
      description: >-
        OAuth 2.0 client identifier, unique within the domain. Generated when omitted on creation:
        read it through `am_application.<name>.client_id`, for example in an output.
        It cannot be changed once set: a different value fails the plan, and removing it from the
        configuration keeps the current value.

  # AM returns an omitted list as empty, and Speakeasy ignores a default on a list of objects,
  # so identityProviders is computed; `identity_providers = []` clears them.
  - target: $.components.schemas.AutomationApplication.properties.identityProviders
    update:
      x-speakeasy-param-computed: true

  - target: $.components.schemas.AutomationApplication.properties.enabled
    update:
      description: Whether the application is enabled. Setting it to false revokes the application's tokens.

  # The OAS describes the API's reset of omitted blocks; Terraform keeps an applied value instead.
  # Set on the schema: OAS 3.0 ignores a description next to the property's $ref.
  - target: $.components.schemas.AutomationApplicationSettings
    update:
      description: >-
        Settings of the application. On creation, an omitted block is unset, except login, account and
        cookie_settings, which are inherited from the domain. Once applied, removing a block or an
        attribute from the configuration keeps its current value: set it explicitly to change it.

  # After its retries, a 409 is a concurrent modification, not an existing application:
  # undeclared, it is reported with AM's message instead of "Resource Already Exists".
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications"].put.responses["409"]
    remove: true

  # AM computes these from type and kind when omitted: a static default would send false and override it.
  # Server-derived settings stay plain computed (no suppress-diff). On a type or kind change, the update
  # omits the undeclared ones (omitUndeclaredDerivedOAuthSettings, internal/provider/application_type_change.go)
  # so AM recomputes them instead of receiving the previous type's values from the state.
  - target: $.components.schemas.AutomationApplicationOAuthSettings.properties["forcePKCE","forceS256CodeChallengeMethod"].default
    remove: true

  # The OAS says browser only; AM master computes it for native applications too.
  - target: $.components.schemas.AutomationApplicationOAuthSettings.properties.forceS256CodeChallengeMethod
    update:
      description: >-
        Whether PKCE requires the S256 code challenge method. Computed (true) for browser and native
        applications created without grantTypes, and for user_embedded agents.
