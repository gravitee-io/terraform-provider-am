overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Client secret overlay
  version: 0.0.1
actions:

  # Entity declaration
  - target: $.components.schemas.AutomationClientSecret
    update:
      x-speakeasy-entity: ClientSecret
      x-speakeasy-entity-description: |-
        A client secret of an application. A secret is immutable: changing `key`, `domain_key` or `application_key` replaces it, and the provider never updates a secret in place.

        Requires Terraform 1.11 or later: the value is the write-only attribute `value_wo`, never stored in the plan or the state.

        To rotate a secret, use two applies: declare a second `am_client_secret` with a new `key` and apply, let the clients switch to the new value, then remove the old resource and apply again. Changing the `key` of an existing secret is not a rotation: it replaces the secret in a single apply, and deleting the old secret revokes it immediately.

  # The resource's own attributes are not computed.
  - target: $.components.schemas.AutomationClientSecret.properties.*
    update:
      x-speakeasy-param-computed: false

  # Body `key` ↔ path `secretKey` correlation: rename the path parameter
  # so Speakeasy auto-matches by name against the entity's `key` field.
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets/{secretKey}"].get.parameters[?@.name=='secretKey']
    update:
      x-speakeasy-name-override: key
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets/{secretKey}"].delete.parameters[?@.name=='secretKey']
    update:
      x-speakeasy-name-override: key

  # Operation mapping. No data source: the value is never returned, so there is nothing to read.
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets"].put
    update:
      x-speakeasy-entity-operation: ClientSecret#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets/{secretKey}"].get
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: ClientSecret#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets/{secretKey}"].delete
    update:
      x-speakeasy-entity-operation: ClientSecret#delete

  # AM answers 409 when concurrent writes hit the same application: retry them like a 5XX.
  # An operation-level block replaces the global one (common/oas.yaml), so it is repeated in full.
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets"].put
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500 # 500 milliseconds
          maxInterval: 30000 # 30 seconds
          maxElapsedTime: 60000 # 1 minute
          exponent: 1.5
        statusCodes:
          - 5XX
          - 409
        retryConnectionErrors: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets/{secretKey}"].delete
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500 # 500 milliseconds
          maxInterval: 30000 # 30 seconds
          maxElapsedTime: 60000 # 1 minute
          exponent: 1.5
        statusCodes:
          - 5XX
          - 409
        retryConnectionErrors: true

  # After its retries, a 409 is a concurrent modification, not an existing secret:
  # undeclared, it is reported with AM's message instead of "Resource Already Exists".
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets"].put.responses["409"]
    remove: true

  # key, the domain and the application are the identity — changing any forces resource recreation.
  # create/update share one PUT op, so ForceNew is not auto-inferred; set it explicitly.
  - target: $.components.schemas.AutomationClientSecret.properties.key
    update:
      x-speakeasy-param-force-new: true
      description: >-
        Stable, immutable identifier for the secret within its application, also used as the
        read-only name of the secret. Lowercase alphanumeric and hyphens, starting and ending with
        an alphanumeric character, at most 64 characters. Changing it replaces the secret: the old one
        is revoked immediately (see the rotation steps above).
  - target: $.paths["/organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}/secrets"].put.parameters[?@.name=='domainKey' || @.name=='applicationKey']
    update:
      x-speakeasy-param-force-new: true

  # The value never reaches the plan or the state (Terraform write-only attribute); the JSON field stays `value`.
  - target: $.components.schemas.AutomationClientSecret.properties.value
    update:
      x-speakeasy-terraform-write-only: true
      x-speakeasy-param-sensitive: true
      x-speakeasy-name-override: value_wo
      description: >-
        Value of the secret, write-only: sent on creation only, never stored in the plan or the state,
        and never returned by AM: feed it from where the clients read it too, for example an ephemeral variable
        filled from your secret store.
        At least 43 characters, from a cryptographically secure random source (at least 32 bytes of entropy),
        never reused across applications. With BCrypt hashing, at most 72 bytes in UTF-8 (BCrypt ignores
        the rest); with no hashing, at most 374 characters. Changing only this value on an existing secret
        has no effect: no diff and no API call. To change the value, rotate the secret with a new `key`.
