overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Common schema Terraform overlay
  version: 0.0.1
actions:

  ## Nested settings are computed: AM fills in the ones a configuration leaves
  ## unset, and Terraform resets a non-computed nested attribute to null when
  ## its parent is unset, so the plan would never converge.
  - target: $.components.schemas.*.properties.*
    description: Keep AM's values for unconfigured nested settings
    update:
      x-speakeasy-param-computed: true

  ## A nested setting left unset keeps AM's value. With a static default, Terraform would plan the
  ## default over the value set in the console, and the update would send the state back for the
  ## unset block: the plan would never converge. The resources and the list items (scope_settings,
  ## virtual hosts...) keep theirs: a list is sent whole from the configuration.
  - target: >-
      $.components.schemas[
      "ApplicationLightweightJwtSettings",
      "AutomationAccountSettings",
      "AutomationAdvancedSettings",
      "AutomationApplicationOAuthSettings",
      "AutomationApplicationSAMLSettings",
      "AutomationAssessmentSettings",
      "AutomationCIBASettings",
      "AutomationChallengeSettings",
      "AutomationClientRegistrationSettings",
      "AutomationCookieSettings",
      "AutomationCrossAppAccessSettings",
      "AutomationEnrollSettings",
      "AutomationOidcSettings",
      "AutomationRememberDeviceSettings",
      "AutomationRiskAssessmentSettings",
      "AutomationSamlSettings",
      "AutomationSessionSettings",
      "AutomationStepUpAuthenticationSettings",
      "AutomationWorkloadIdentitySettings",
      "CorsSettings",
      "CspSettings",
      "IdJagSettings",
      "KeyRetrievalSettings",
      "LoginSettings",
      "PasswordSettings",
      "ResetPasswordSettings",
      "SCIMSettings",
      "SecurityProfileSettings",
      "SelfServiceAccountManagementSettings",
      "SpiffeDomainSettings",
      "TokenExchangeOAuthSettings",
      "TokenExchangeSettings",
      "UMASettings",
      "WebAuthnSettings",
      "XFrameSettings",
      "XssProtectionSettings"
      ].properties.*.default
    description: Keep AM's values for unconfigured nested settings
    remove: true

  ## Drop the Error schema from generated Terraform state shape.
  - target: $.components.schemas.Error
    description: Intentionally ignored for Terraform state
    update:
      x-speakeasy-terraform-ignore: true

  ## Only returned by dry runs, which the provider does not use.
  - target: $.components.schemas.*.properties.dryRunErrors
    description: Not necessary in Terraform context
    update:
      x-speakeasy-terraform-ignore: true
